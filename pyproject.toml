[project]
name = "hertz"
version = "0.36.0"
description = "AI-driven content creation and automation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "edge-tts>=6.1",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    "yt-dlp>=2026.7.4",
    "imageio-ffmpeg>=0.6.0",
    "aiofiles>=25.1.0",
    "jieba>=0.42.1",
    "cryptography>=50.0.0",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
    "sentencepiece>=0.2",
    # 本地引擎运行时（v0.31 B1）：asr.py 直接 import faster_whisper，
    # translate_engine.py 直接 import ctranslate2——被代码直接 import 的依赖
    # 必须是主依赖。此前 faster-whisper 待在可选组 asr、ctranslate2 仅靠传递
    # 依赖存在，而 CI/dev.sh/模拟脚本一律跑裸 `uv sync`，于是「去 API 化转写
    # 与翻译」在开发态和打包态同时不可用（v0.31 spike 实测暴露）。
    "faster-whisper>=1.2.1",
    "ctranslate2>=4.8.1",
    # Monoline 融合域（docs/monoline-fusion.md）：markdown 块解析 + compose 模板渲染——
    # 被 backend/monoline 直接 import，主依赖（同上注释的 v0.31 教训）。
    "markdown-it-py>=4.2.0",
    "jinja2>=3.1",
    # Monoline 融合域 TTS/字体（docs/monoline-fusion.md D-024，Phase 0 已在 py3.12 验证）：
    # kokoro-onnx 为 py3-none-any 纯包，3.11 pin 已是过期约束。
    "kokoro-onnx>=0.6",
    "misaki[zh]>=0.9",
    "soundfile>=0.12",
    "onnxruntime>=1.20",
    "cn2an>=0.5",
    "fonttools>=4.55",
    "brotli>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.27",
    "pyinstaller>=6.22.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# 多行字符串内长行无法行内 noqa（AI 提示词 / XML fixture 内容），保留原样
"backend/ai/prompts/title.py" = ["E501"]
"tests/test_download_resilience.py" = ["E501"]
# Monoline 融合域逐行移植文件（docs/monoline-fusion.md）：与上游同行号可 diff，
# E501 豁免，逻辑类规则（F/I/N/UP/B）仍全量执行
"backend/monoline/audio_mix.py" = ["E501"]
"backend/monoline/compose.py" = ["E501"]
"backend/monoline/determinism.py" = ["E501"]
"backend/monoline/display_text.py" = ["E501"]
"backend/monoline/icons.py" = ["E501"]
"backend/monoline/markdown.py" = ["E501"]
"backend/monoline/narration.py" = ["E501"]
"backend/monoline/planner.py" = ["E501"]
"backend/monoline/rotation.py" = ["E501"]
"backend/monoline/sceneplan.py" = ["E501"]
"backend/monoline/segment.py" = ["E501"]
"backend/monoline/subset.py" = ["E501"]
"backend/monoline/subtitles.py" = ["E501"]
"backend/monoline/timings.py" = ["E501"]
"backend/monoline/tts_zh.py" = ["E501"]
"backend/monoline/viz.py" = ["E501"]
"backend/monoline/llm_plan.py" = ["E501"]
"backend/monoline/voices.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
