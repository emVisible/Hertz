[project]
name = "hertz"
version = "0.30.1"
description = "AI-driven content creation and automation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "edge-tts>=6.1",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    "yt-dlp>=2026.7.4",
    "imageio-ffmpeg>=0.6.0",
    "aiofiles>=25.1.0",
    "jieba>=0.42.1",
    "cryptography>=50.0.0",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
    "sentencepiece>=0.2",
    # 本地引擎运行时（v0.31 B1）：asr.py 直接 import faster_whisper，
    # translate_engine.py 直接 import ctranslate2——被代码直接 import 的依赖
    # 必须是主依赖。此前 faster-whisper 待在可选组 asr、ctranslate2 仅靠传递
    # 依赖存在，而 CI/dev.sh/模拟脚本一律跑裸 `uv sync`，于是「去 API 化转写
    # 与翻译」在开发态和打包态同时不可用（v0.31 spike 实测暴露）。
    "faster-whisper>=1.2.1",
    "ctranslate2>=4.8.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.27",
    "pyinstaller>=6.22.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# 多行字符串内长行无法行内 noqa（AI 提示词 / XML fixture 内容），保留原样
"backend/ai/prompts/title.py" = ["E501"]
"tests/test_download_resilience.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
