[project]
name = "hertz"
version = "0.15.1"
description = "AI-driven content creation and automation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "edge-tts>=6.1",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    "yt-dlp>=2026.7.4",
    "imageio-ffmpeg>=0.6.0",
    "aiofiles>=25.1.0",
    "jieba>=0.42.1",
    "cryptography>=50.0.0",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# 多行字符串内长行无法行内 noqa（AI 提示词 / XML fixture 内容），保留原样
"backend/ai/prompts/title.py" = ["E501"]
"tests/test_download_resilience.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
