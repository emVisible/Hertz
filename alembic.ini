[alembic]
script_location = alembic
prepend_sys_path = .
# Keep this file ASCII-only: the frozen backend reads it through configparser's
# default encoding, which resolves to ASCII in the PyInstaller runtime -- any
# non-ASCII comment (even in a `#` line) crashes first boot with
# UnicodeDecodeError. Rationale for path_separator lives in
# backend/infrastructure/migration_guard.py and docs/DECISIONS.md (D-202).
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
